# storage/flume.conf

# Python event stream -> Apache Flume -> Local File System


# ============================================================
# AGENT
# ============================================================

agent.sources = sensor_source
agent.channels = memory_channel
agent.sinks = file_sink


# ============================================================
# SOURCE
# Read sensor events generated by the Python backend
# ============================================================

agent.sources.sensor_source.type = exec

agent.sources.sensor_source.command = tail -F data/flume_input/sensor_events.log

agent.sources.sensor_source.shell = /bin/bash -c

agent.sources.sensor_source.channels = memory_channel


# ============================================================
# CHANNEL
# ============================================================

agent.channels.memory_channel.type = memory

agent.channels.memory_channel.capacity = 10000

agent.channels.memory_channel.transactionCapacity = 1000


# ============================================================
# SINK
# Store events in the local filesystem
# ============================================================

agent.sinks.file_sink.type = file_roll

agent.sinks.file_sink.sink.directory = ./data/flood_history

agent.sinks.file_sink.rollInterval = 60

agent.sinks.file_sink.rollSize = 0

agent.sinks.file_sink.rollCount = 0

agent.sinks.file_sink.serializer = TEXT

agent.sinks.file_sink.batchSize = 100

agent.sinks.file_sink.channel = memory_channel